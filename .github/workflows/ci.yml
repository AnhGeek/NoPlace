# The checks from docs/10-engineering-standards.md, run on every push and PR.
#
# This is the gate; release.yml is the shipping half. Both pin the same Flutter
# version as app/.metadata — a floating `stable` means a Flutter release can
# turn main red without anybody touching the code.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. Nobody needs the results
# of a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.1"

jobs:
  analyze:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Catches "edited design/tokens/*.json but forgot to regenerate".
      #
      # Not `--check`: five of the builder's six outputs live under
      # design/build/, which .gitignore excludes, so they are absent from a
      # fresh clone and --check would report them stale on every single run.
      # Regenerating and then diffing asserts the same thing against the one
      # generated file that is actually under version control.
      #
      # The builder is its own package: dependency-free, but it still needs a
      # pub get for a package_config.json, or `dart run` cannot resolve its own
      # `package:token_builder/` imports. It locates the repo root itself, so
      # it does not care which directory it is invoked from.
      - name: Design tokens are in sync
        run: |
          dart pub get --directory tools/token_builder
          dart run tools/token_builder/bin/build_tokens.dart
          git diff --exit-code -- app/lib/design_system/tokens/design_tokens.g.dart

      - name: Formatting
        working-directory: app
        run: dart format --set-exit-if-changed lib test

      # --fatal-infos: analysis_options.yaml is stricter than flutter_lints on
      # purpose, and an info there is a real finding.
      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: app
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: warn

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Debug, not release: this job proves the Android build still assembles.
      # Signing belongs to release.yml, which is the only place the upload key
      # is ever decrypted. arm64 only, matching what release.yml ships — there
      # is no point gating merges on an ABI nobody receives.
      - name: Build
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64
