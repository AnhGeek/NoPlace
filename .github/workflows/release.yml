# Builds signed release APKs and attaches them to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag is the source of truth for the marketing version; the build number is
# the workflow run number, which only ever goes up. Neither is read from
# pubspec.yaml — see docs/10-engineering-standards.md, "the build number is
# bumped by CI, never by hand on a feature branch".
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Re-run a release by hand, e.g. after fixing an expired secret.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.1"

permissions:
  # Needed to create the Release and upload the APKs to it.
  contents: write

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # v0.1.0 -> 0.1.0. `flutter build --build-name` rejects the leading v.
      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # The same gate as CI. A tag can be pushed to a commit that never opened a
      # pull request, so this is not redundant.
      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

      # Without this the Gradle config falls back to the debug key, and the
      # debug keystore is generated fresh on every runner — so each release
      # would be signed by a different key and users could not upgrade in
      # place. Fail here rather than ship that.
      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See README, 'Releasing'."
            exit 1
          fi

      # Written into the workspace, which is discarded when the job ends. The
      # paths match android/app/build.gradle.kts: key.properties sits at
      # android/, storeFile resolves against android/app/.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # arm64 only, deliberately. The one device this ships to is a Samsung
      # Galaxy A06 (Helio G85), which is arm64-v8a — so armeabi-v7a, x86_64 and
      # the fat universal build were all weight nobody downloads. Add a target
      # back here the day a second device needs one.
      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ github.run_number }}"

      # Flutter calls every build app-release.apk, which tells a user who
      # downloaded it nothing about which version they have.
      - name: Name the artifact after the release
        run: |
          mkdir -p dist
          V="${{ steps.version.outputs.name }}"
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "dist/noplace-$V-arm64-v8a.apk"
          ls -lh dist

      # Checksums, so a download can be verified without trusting the CDN.
      - name: Checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # GitHub's own asset list sits below the fold and names a file, not a
      # link you can hand to somebody. The notes lead with the download.
      - name: Compose the download section
        run: |
          V="${{ steps.version.outputs.name }}"
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}"
          APK="noplace-$V-arm64-v8a.apk"
          SIZE=$(numfmt --to=iec --format='%.0f' "$(stat -c %s "dist/$APK")")

          {
            echo "## Download"
            echo
            echo "### ⬇️ [$APK]($BASE/$APK) — $SIZE"
            echo
            echo "Built for **arm64-v8a** only, which is what the Samsung Galaxy A06 and every other 64-bit ARM phone runs. It will not install on a 32-bit device or an x86 emulator."
            echo
            echo "Sideloading: open the file on the phone and allow installs from your browser when Android asks."
            echo
            echo "Verify it against [SHA256SUMS.txt]($BASE/SHA256SUMS.txt):"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo '```'
            echo
            echo "> **No basemap.** Region packs are not committed, so these builds draw no streets. See the README for how to cook one."
          } > RELEASE_BODY.md

          cat RELEASE_BODY.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NoPlace ${{ steps.version.outputs.name }}
          # Prepended to the auto-generated commit/contributor notes.
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          # A tag ending in -beta/-rc marks the release as a pre-release.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      # The keystore only ever lived on this runner, but leaving it in the
      # workspace of a job that later gains an artifact upload step is how it
      # would leak.
      - name: Shred the keystore
        if: always()
        run: rm -f app/android/app/upload-keystore.jks app/android/key.properties
